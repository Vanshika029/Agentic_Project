version: '3.8'

services:
  backend:
    build: .
    container_name: enterprise_hr_backend
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: .
    container_name: enterprise_hr_frontend
    ports:
      - "8501:8501"
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
    restart: unless-stopped
